name: 'anil_dbt_project'
version: '1.0.0'
require-dbt-version: [">=1.8.0", "<2.0.0"]

profile: 'anil_dbt_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

flags:
  send_anonymous_usage_stats: false

models:
  anil_dbt_project:
    +materialized: view
    example:
      bronze:
        +materialized: table
        +schema: bronze
      silver:
        +materialized: view
        +schema: silver
      gold:
        +materialized: table
        +schema: gold